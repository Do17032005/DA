<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Tài khoản của tôi</title>
</head>

<body>
    <main layout:fragment="content">
        <div class="container my-5">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
                    <li class="breadcrumb-item active">Tài khoản</li>
                </ol>
            </nav>

            <div class="row">
                <!-- Sidebar Menu -->
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body p-0">
                            <div class="list-group list-group-flush">
                                <a href="/user/profile" class="list-group-item list-group-item-action active">
                                    <i class="fas fa-user me-2"></i>Thông tin tài khoản
                                </a>
                                <a href="/user/orders" class="list-group-item list-group-item-action">
                                    <i class="fas fa-box me-2"></i>Đơn hàng của tôi
                                </a>
                                <a href="/user/address" class="list-group-item list-group-item-action">
                                    <i class="fas fa-map-marker-alt me-2"></i>Địa chỉ giao hàng
                                </a>
                                <a href="/user/vouchers" class="list-group-item list-group-item-action">
                                    <i class="fas fa-ticket-alt me-2"></i>Voucher của tôi
                                </a>
                                <a href="/wishlist" class="list-group-item list-group-item-action">
                                    <i class="fas fa-heart me-2"></i>Sản phẩm yêu thích
                                </a>
                                <a href="/user/change-password" class="list-group-item list-group-item-action">
                                    <i class="fas fa-lock me-2"></i>Đổi mật khẩu
                                </a>
                                <a href="/logout" class="list-group-item list-group-item-action text-danger">
                                    <i class="fas fa-sign-out-alt me-2"></i>Đăng xuất
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Main Content -->
                <div class="col-md-9">
                    <!-- Profile Information -->
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0">
                                <i class="fas fa-user-circle me-2"></i>Thông tin cá nhân
                            </h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/user/profile/update}" method="post" enctype="multipart/form-data">
                                <div class="row">
                                    <!-- Avatar -->
                                    <div class="col-md-3 text-center mb-4">
                                        <div class="position-relative d-inline-block">
                                            <img th:src="${user.avatarUrl != null ? user.avatarUrl : '/images/default-avatar.svg'}"
                                                alt="Avatar" class="rounded-circle mb-3"
                                                style="width: 150px; height: 150px; object-fit: cover; border: 3px solid #0066cc;"
                                                id="avatarPreview">
                                            <label for="avatarInput"
                                                class="btn btn-sm btn-primary position-absolute bottom-0 end-0 rounded-circle"
                                                style="width: 40px; height: 40px; padding: 0;" title="Thay đổi ảnh">
                                                <i class="fas fa-camera"></i>
                                            </label>
                                            <input type="file" id="avatarInput" name="avatar" accept="image/*"
                                                class="d-none" onchange="previewAvatar(this)">
                                        </div>
                                        <p class="small text-muted">JPG, PNG. Max 2MB</p>
                                    </div>

                                    <!-- Form Fields -->
                                    <div class="col-md-9">
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <label class="form-label">Họ và tên <span
                                                        class="text-danger">*</span></label>
                                                <input type="text" class="form-control" name="fullName" required
                                                    th:value="${user.fullName}">
                                            </div>
                                            <div class="col-md-6 mb-3">
                                                <label class="form-label">Số điện thoại <span
                                                        class="text-danger">*</span></label>
                                                <input type="tel" class="form-control" name="phone" required
                                                    th:value="${user.phone}" pattern="[0-9]{10}">
                                            </div>
                                        </div>

                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <label class="form-label">Email <span
                                                        class="text-danger">*</span></label>
                                                <input type="email" class="form-control" name="email" required
                                                    th:value="${user.email}" readonly>
                                                <small class="text-muted">Email không thể thay đổi</small>
                                            </div>
                                            <div class="col-md-6 mb-3">
                                                <label class="form-label">Giới tính</label>
                                                <select class="form-select" name="gender">
                                                    <option value="">-- Chọn --</option>
                                                    <option value="male" th:selected="${user.gender == 'male'}">Nam
                                                    </option>
                                                    <option value="female" th:selected="${user.gender == 'female'}">Nữ
                                                    </option>
                                                    <option value="other" th:selected="${user.gender == 'other'}">Khác
                                                    </option>
                                                </select>
                                            </div>
                                        </div>

                                        <div class="mb-3">
                                            <label class="form-label">Ngày sinh</label>
                                            <input type="date" class="form-control" name="dateOfBirth"
                                                th:value="${user.dateOfBirth}">
                                        </div>

                                        <div class="d-flex gap-2">
                                            <button type="submit" class="btn btn-primary">
                                                <i class="fas fa-save me-1"></i>Lưu thay đổi
                                            </button>
                                            <button type="reset" class="btn btn-outline-secondary">
                                                <i class="fas fa-undo me-1"></i>Hủy
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Account Statistics -->
                    <div class="row mb-4">
                        <div class="col-md-4">
                            <div class="card border-0 shadow-sm text-center p-4 bg-primary bg-gradient text-white">
                                <i class="fas fa-box fa-3x mb-3"></i>
                                <h3 class="mb-1" th:text="${orderCount ?: 0}">0</h3>
                                <p class="mb-0">Đơn hàng</p>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card border-0 shadow-sm text-center p-4 bg-success bg-gradient text-white">
                                <i class="fas fa-heart fa-3x mb-3"></i>
                                <h3 class="mb-1" th:text="${wishlistCount ?: 0}">0</h3>
                                <p class="mb-0">Yêu thích</p>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card border-0 shadow-sm text-center p-4 bg-warning bg-gradient text-white">
                                <i class="fas fa-ticket-alt fa-3x mb-3"></i>
                                <h3 class="mb-1" th:text="${voucherCount ?: 0}">0</h3>
                                <p class="mb-0">Voucher</p>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <th:block layout:fragment="scripts">
        <script>
            function previewAvatar(input) {
                if (input.files && input.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        $('#avatarPreview').attr('src', e.target.result);
                    };
                    reader.readAsDataURL(input.files[0]);
                }
            }


        </script>
    </th:block>
</body>

</html>
