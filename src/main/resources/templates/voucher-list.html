<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title th:text="${pageTitle}">Săn Voucher</title>
    <style>
        .voucher-card {
            border: 2px dashed #0d6efd;
            border-radius: 15px;
            transition: all 0.3s;
            background-color: #f8f9fa;
        }

        .voucher-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .voucher-left {
            border-right: 1px dashed #dee2e6;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0d6efd;
            color: white;
            border-radius: 13px 0 0 13px;
            min-width: 120px;
        }

        .voucher-right {
            padding: 20px;
            flex-grow: 1;
        }

        .collected-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            transform: rotate(15deg);
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <main layout:fragment="content">
        <div class="container my-5">
            <div class="text-center mb-5">
                <h1 class="fw-bold">Kho Voucher Khuyến Mãi</h1>
                <p class="text-muted">Thu thập ngay các voucher ưu đãi nhất từ Clothes Shop</p>
            </div>

            <div class="row g-4">
                <div class="col-md-6" th:each="voucher : ${vouchers}">
                    <div class="card voucher-card h-100 border-0 flex-row overflow-hidden position-relative">
                        <div class="voucher-left">
                            <div class="text-center">
                                <i class="fas fa-ticket-alt fa-2x mb-2"></i>
                                <div class="h4 mb-0" th:if="${voucher.discountType.name() == 'PERCENTAGE'}">
                                    <span
                                        th:text="${voucher.discountValue != null ? #numbers.formatDecimal(voucher.discountValue, 0, 0) : '0'}">10</span>%
                                </div>
                                <div class="h5 mb-0" th:if="${voucher.discountType.name() == 'FIXED'}">
                                    <span
                                        th:text="${voucher.discountValue != null ? #numbers.formatDecimal(voucher.discountValue, 0, 0) : '0'}">50</span>K
                                </div>
                            </div>
                        </div>
                        <div class="voucher-right">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h5 class="fw-bold mb-0 text-primary"
                                    th:text="${voucher.voucherName ?: 'Ưu đãi Đặc biệt'}">Voucher Name</h5>
                            </div>
                            <p class="text-muted small mb-3" th:text="${voucher.description}">Mô tả voucher</p>

                            <div class="d-flex justify-content-between align-items-end">
                                <div>
                                    <div class="small text-muted">
                                        <i class="far fa-clock me-1"></i>HSD:
                                        <span
                                            th:text="${voucher.endDate != null ? #temporals.format(voucher.endDate, 'dd/MM/yyyy') : 'Vô thời hạn'}">31/12/2026</span>
                                    </div>
                                    <div class="small text-muted">
                                        <i class="fas fa-shopping-bag me-1"></i>Đơn từ:
                                        <span
                                            th:text="${voucher.minOrderValue != null ? #numbers.formatDecimal(voucher.minOrderValue, 0, 0) : '0'} + 'đ'">100.000đ</span>
                                    </div>
                                </div>
                                <div>
                                    <button class="btn btn-primary btn-sm collect-btn" th:data-id="${voucher.voucherId}"
                                        onclick="collectVoucher(this)">
                                        Thu thập
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12 text-center py-5" th:if="${vouchers == null || vouchers.empty}">
                    <div class="mb-4">
                        <i class="fas fa-ticket-alt fa-4x text-muted"></i>
                    </div>
                    <h3>Hết voucher mất rồi!</h3>
                    <p class="text-muted">Chúng tôi sẽ sớm cập nhật thêm các mã khuyến mãi mới. Hãy quay lại sau nhé.
                    </p>
                    <a href="/products" class="btn btn-primary mt-3">Tiếp tục mua sắm</a>
                </div>
            </div>
        </div>
    </main>

    <th:block layout:fragment="scripts">
        <script>
            function collectVoucher(btn) {
                const voucherId = btn.getAttribute('data-id');

                // Check if logged in (from layout.html window.appContext)
                if (!window.appContext || !window.appContext.userId) {
                    window.location.href = '/login?redirect=/vouchers';
                    return;
                }

                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

                $.post('/user/vouchers/collect/' + voucherId, function (response) {
                    if (response.success) {
                        btn.innerHTML = 'Đã nhận <i class="fas fa-check"></i>';
                        btn.classList.remove('btn-primary');
                        btn.classList.add('btn-success');

                        // Show success message
                        const alertHtml = `
                            <div class="alert alert-success alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3" style="z-index: 9999">
                                <i class="fas fa-check-circle me-2"></i> ${response.message}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        `;
                        $('body').append(alertHtml);

                        // Auto hide alert
                        setTimeout(() => {
                            $('.alert').fadeOut('slow', function () { $(this).remove(); });
                            // Optionally remove card if on search page
                            // $(btn).closest('.col-md-6').fadeOut();
                        }, 3000);
                    } else {
                        alert(response.message);
                        btn.disabled = false;
                        btn.innerHTML = 'Thu thập';
                    }
                }).fail(function () {
                    alert('Có lỗi xảy ra, vui lòng thử lại sau!');
                    btn.disabled = false;
                    btn.innerHTML = 'Thu thập';
                });
            }
        </script>
    </th:block>
</body>

</html>
