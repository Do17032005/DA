# ================================================
# SPRING BOOT CONFIGURATION - CLOTHES SHOP
# ================================================
spring.application.name=clothes
server.port=${PORT:8080}  

# ================================================
# DATABASE CONFIGURATION (MySQL Aiven)
# ================================================
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-1bf49a9c-nghiengame005.c.aivencloud.com:27021/clothesshopdb?ssl-mode=REQUIRED&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.password=${DB_PASSWORD:AVNS_OY6UdTSUCEJY08Wic_V}
spring.datasource.username=${DB_USER:avnadmin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================================
# HIKARICP CONNECTION POOL
# ================================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ClothesShopHikariCP

# ================================================
# DATABASE INITIALIZATION (Disabled - using existing Aiven Cloud database)
# ================================================
spring.sql.init.mode=never
# spring.sql.init.schema-locations=classpath:database-schema.sql
# spring.sql.init.data-locations=classpath:data.sql
# spring.sql.init.continue-on-error=false

# ================================================
# LOGGING CONFIGURATION
# ================================================
logging.level.root=INFO
logging.level.com.clothes=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Static Resources Configuration
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server Configuration
server.error.whitelabel.enabled=false
server.error.path=/error

# ================================================
# CLOUDINARY CONFIGURATION
# ================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dvw1rgffq}
cloudinary.api-key=${CLOUDINARY_API_KEY:663987817697383}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:DzIhA9Uq76qYQ6FP2W2REYb9pWM}

# Recommendation configuration
recommendation.time-decay.enabled=true
recommendation.time-decay.window-days=30
recommendation.time-decay.lambda=0.08
recommendation.weights.user-based=0.3
recommendation.weights.item-based=0.5
recommendation.weights.trending=0.2
